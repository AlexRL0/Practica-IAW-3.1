---
- name: Deploy Moodle
  hosts: frontend
  become: true

  vars_files:
    - ../vars/variables.yml

  tasks:
    - name: Limpiar descargas previas de Moodle
      file:
        path: /tmp/moodle*
        state: absent
      ignore_errors: true

    - name: Limpiar directorio /var/www/html
      file:
        path: /var/www/html/*
        state: absent
      ignore_errors: true

    - name: Descargar el código fuente de Moodle
      get_url:
        url: https://download.moodle.org/download.php/direct/stable405/moodle-latest-405.tgz
        dest: /tmp/moodle-latest-405.tgz

    - name: Extraer Moodle
      unarchive:
        src: /tmp/moodle-latest-405.tgz
        dest: /tmp
        remote_src: yes

    - name: Mover Moodle al directorio deseado
      command: mv /tmp/moodle {{ moodle_directory }}

    - name: Configurar permisos para apache
      file:
        path: "{{ moodle_directory }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
        recurse: yes

    - name: Crear base de datos para Moodle
      mysql_db:
        name: "{{ moodle_db_name }}"
        state: present
        encoding: utf8mb4
        collation: utf8mb4_unicode_ci

    - name: Crear usuario de base de datos para Moodle
      mysql_user:
        name: "{{ moodle_db_user }}"
        password: "{{ moodle_db_password }}"
        priv: "{{ moodle_db_name }}.*:ALL"
        host: "{{ ip_cliente_mysql }}"
        state: present

    - name: Configurar Moodle
      template:
        src: "{{ moodle_directory }}/config-dist.php"
        dest: "{{ moodle_directory }}/config.php"

    - name: Modificar config.php para Moodle
      lineinfile:
        path: "{{ moodle_directory }}/config.php"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      with_items:
        - { regexp: "'pgsql'", line: "'{{ moodle_type }}'" }
        - { regexp: "'localhost'", line: "'{{ moodle_db_host }}'" }
        - { regexp: "'moodle'", line: "'{{ moodle_db_name }}'" }
        - { regexp: "'username'", line: "'{{ moodle_db_user }}'" }
        - { regexp: "'password'", line: "'{{ moodle_db_password }}'" }
        - { regexp: "\\$CFG->wwwroot.*", line: "\\$CFG->wwwroot = 'https://{{ moodle_domain }}';" }
        - { regexp: "\\$CFG->dataroot.*", line: "\\$CFG->dataroot = '{{ moodle_data_directory }}';" }

    - name: Configurar max_input_vars en php.ini
      lineinfile:
        path: /etc/php/8.3/{{ item }}/php.ini
        regexp: "^max_input_vars.*"
        line: "max_input_vars = 5000"
      with_items:
        - cli
        - apache2

    - name: Crear directorio de datos de Moodle
      file:
        path: "{{ moodle_data_directory }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
        recurse: yes

    - name: Reiniciar apache
      service:
        name: apache2
        state: restarted
