---
- name: Deploy Moodle
  hosts: frontend
  become: true

  vars_files:
    - ../vars/variables.yml

  tasks:
    - name: Limpiar descargas previas de Moodle
      file:
        path: /tmp/moodle*
        state: absent
      ignore_errors: true

    - name: Limpiar directorio /var/www/html
      file:
        path: /var/www/html/*
        state: absent
      ignore_errors: true

    - name: Limpiar directorio /var/www/html/moodle
      file:
        path: /var/www/html/moodle/*
        state: absent
      ignore_errors: true

    - name: Descargar el código fuente de Moodle
      get_url:
        url: https://download.moodle.org/download.php/direct/stable405/moodle-latest-405.tgz
        dest: /tmp/moodle-latest-405.tgz

    - name: Extraer Moodle
      unarchive:
        src: /tmp/moodle-latest-405.tgz
        dest: /tmp
        remote_src: yes

    - name: Mover Moodle al directorio deseado
      command: mv /tmp/moodle {{ moodle.directory }}

    - name: Configurar permisos para apache
      file:
        path: "{{ moodle.directory }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
        recurse: yes

    - name: Copiar archivo config-dist.php
      copy:
        src: "{{ moodle.directory }}/config-dist.php"
        dest: "{{ moodle.directory }}/config.php"
        remote_src: yes

    - name: Ejecutar instalación de Moodle
      command: >
        sudo -u www-data php /var/www/html/moodle/admin/cli/install.php
        --lang=es
        --wwwroot=https://{{ moodle.domain }}
        --dataroot=/var/www/moodledata
        --dbtype=mysqli
        --dbhost={{ moodle.db_host }}
        --dbname={{ moodle.db_name }}
        --dbuser={{ moodle.db_user }}
        --dbpass={{ moodle.db_password }}
        --fullname="Moodle"
        --shortname="ARL"
        --summary="celia"
        --adminuser=admin
        --adminpass="Admin01%"
        --adminemail="admin@gmail.com"
        --non-interactive
        --agree-license

    - name: Configurar max_input_vars en php.ini
      lineinfile:
        path: /etc/php/8.3/{{ item }}/php.ini
        regexp: "^max_input_vars.*"
        line: "max_input_vars = 5000"
      with_items:
        - cli
        - apache2

    - name: Crear directorio de datos de Moodle
      file:
        path: "{{ moodle.data_directory }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
        recurse: yes

    - name: Reiniciar apache
      service:
        name: apache2
        state: restarted
