---
- name: Playbook para hacer el deploy de la aplicación web moodle
  hosts: frontend
  become: yes

  vars_files:
    - ../vars/variables.yml

  tasks:

    - name: Limpiar descargas previas de Moodle
      file:
        path: /tmp/moodle*
        state: absent
      ignore_errors: true

    - name: Limpiar directorio /var/www/html
      file:
        path: /var/www/html/*
        state: absent
      ignore_errors: true

    - name: Limpiar directorio /var/www/moodledata
      file:
        path: /var/www/moodledata/*
        state: absent
      ignore_errors: true

    - name: Descargar el código fuente de moodle
      get_url:
        url: https://github.com/moodle/moodle/archive/refs/tags/v4.3.1.zip 
        dest: /tmp
        mode: 0755

    - name: Descomprimir el paquete de moodle
      unarchive:
        src: /tmp/moodle-4.3.1.zip  
        dest: /tmp
        remote_src: yes

    - name: Mover Moodle al directorio deseado
      command:
        cmd: mv /tmp/moodle-4.3.1 {{ moodle.directory }}

    - name: Configurar permisos para el directorio moodle
      file:
        path: "{{ moodle.directory }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
        recurse: yes

    - name: Configurar permisos para el directorio moodledata
      file:
        path: "{{ moodle.data_directory }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0777'
        recurse: yes
        
    - name: Instalar moodle desde PHP CLI
      command:
        sudo -u www-data php /var/www/html/moodle/admin/cli/install.php \
        --lang=es
        --wwwroot=https://{{moodle.domain}}
        --dataroot={{moodle.data_directory}}
        --dbtype=mysqli
        --dbhost={{moodle.db_host}}
        --dbname={{moodle.db_name}}
        --dbuser={{moodle.db_user}}
        --dbpass={{moodle.db_password}}
        --fullname="Moodle"
        --shortname="ARL"
        --summary="celia"
        --adminuser=admin
        --adminpass="Admin01%"
        --adminemail="admin@gmail.com"
        --non-interactive
        --agree-license
      args:
        chdir: /var/www/html/moodle

    - name: Configurar cron para Moodle
      become: yes
      ansible.builtin.cron:
        name: "Moodle Cron Job"
        minute: "*"
        job: "/usr/bin/php /var/www/html/moodle/admin/cli/cron.php >/dev/null 2>&1"
        state: present


    - name: Reiniciar servicio cron 
      become: yes
      ansible.builtin.service:
        name: cron
        state: restarted
        enabled: yes