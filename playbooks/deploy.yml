---
- name: Deploy Moodle
  hosts: frontend
  become: true

  vars_files:
    - ../vars/variables.yml

  tasks:
    - name: Mostrar comandos
      command: set -ex

    - name: Importar variables de entorno
      shell: source .env

    - name: Limpiar descargas previas de Moodle
      file:
        path: /tmp/moodle*
        state: absent

    - name: Limpiar directorio /var/www/html
      file:
        path: /var/www/html/*
        state: absent

    - name: Descargar el código fuente de Moodle
      get_url:
        url: https://download.moodle.org/download.php/direct/stable405/moodle-latest-405.tgz
        dest: /tmp/moodle-latest-405.tgz

    - name: Extraer Moodle
      unarchive:
        src: /tmp/moodle-latest-405.tgz
        dest: /tmp
        remote_src: yes

    - name: Mover Moodle al directorio deseado
      command: mv /tmp/moodle {{ moodle.directory }}


    - name: Configurar permisos para apache
      file:
        path: "{{ moodle.directory }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
        recurse: yes

    - name: Copiar archivo config-dist.php
      copy:
        src: "{{ moodle.directory }}/config-dist.php"
        dest: "{{ moodle.directory }}/config.php"
        remote_src: yes

    - name: Modificar config.php para Moodle
      lineinfile:
        path: "{{ moodle.directory }}/config.php"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      with_items:
        - { regexp: "'pgsql'", line: "'{{ moodle.type }}'" }
        - { regexp: "'localhost'", line: "'{{ moodle.db_host }}'" }
        - { regexp: "'moodle'", line: "'{{ moodle.db_name }}'" }
        - { regexp: "'username'", line: "'{{ moodle.db_user }}'" }
        - { regexp: "'password'", line: "'{{ moodle.db_password }}'" }
        - { regexp: "\\$CFG->wwwroot.*", line: "\\$CFG->wwwroot = 'https://{{ moodle.domain }}';" }
        - { regexp: "\\$CFG->dataroot.*", line: "\\$CFG->dataroot = '{{ moodle.data_directory }}';" }

    - name: Configurar max_input_vars en php.ini
      lineinfile:
        path: /etc/php/8.3/{{ item }}/php.ini
        regexp: "^max_input_vars.*"
        line: "max_input_vars = 5000"
      with_items:
        - cli
        - apache2

    - name: Crear directorio de datos de Moodle
      file:
        path: "{{ moodle.data_directory }}"
        state: directory
        owner: www-data
        group: www-data
        mode: '0755'
        recurse: yes

    - name: Reiniciar apache
      service:
        name: apache2
        state: restarted
