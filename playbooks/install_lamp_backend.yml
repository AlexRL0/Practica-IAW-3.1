---
- name: Playbook para instalar la pila LAMP en el Backend
  hosts: backend
  become: yes

  vars_files:
    - ../vars/variables.yml

  tasks:

    - name: Actualizar los repositorios
      apt:
        update_cache: yes

    - name: Instalar el sistema gestor de bases de datos MySQL
      apt:
        name: mysql-server
        state: present

    - name: Instalamos el módulo de pymysql
      apt:
        name: python3-pymysql
        state: present

    - name: Crear base de datos para Moodle
      mysql_db:
        name: "{{ db.name }}"
        state: present
        encoding: utf8mb4
        collation: utf8mb4_unicode_ci

    - name: Crear usuario de base de datos para Moodle
      mysql_user:
        name: "{{ db.user }}"
        password: "{{ db.password }}"
        priv: "{{ db.name }}.*:ALL"
        host: "{{ moodle.ip_cliente_mysql }}"
        state: present

    - name: Reiniciamos el servicio de base de datos
      service:
        name: mysql
        state: restarted